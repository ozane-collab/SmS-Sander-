<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBE SMS Simulator System</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-purple: #5c5470;
            --primary-purple-hover: #4b445c;
            --success-green: #2e7d32;
            --success-green-hover: #215c24;
            --border-color: #cccccc;
            --preview-bg: #eef1f6;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* የደህንነት ጥበቃ ገጽ */
        #securityScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #111111;
            color: #ff3333;
            font-size: 2rem;
            font-weight: bold;
            z-index: 9999;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: none; 
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            min-height: 550px;
        }

        .page {
            display: none;
            padding: 30px;
        }

        .page.active {
            display: block;
        }

        .main-working-area {
            display: flex;
            gap: 30px;
        }

        .form-section {
            flex: 1.2;
        }

        .preview-section {
            flex: 1;
            background-color: #fafafa;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
        }

        select, input, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .btn {
            width: 100%;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 12px;
        }

        .btn-purple { background-color: var(--primary-purple); }
        .btn-purple:hover { background-color: var(--primary-purple-hover); }
        .btn-green { background-color: var(--success-green); }
        .btn-green:hover { background-color: var(--success-green-hover); }

        .preview-box {
            width: 100%;
            min-height: 160px;
            background-color: var(--preview-bg);
            border-radius: 8px;
            padding: 15px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #444;
            margin-bottom: 20px;
            word-break: break-word;
            border: 1px dashed #b5bfc9;
        }

        .preview-box.generated {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            font-family: monospace;
        }

        .bulk-link-btn { background-color: #3f51b5; }
        .bulk-link-btn:hover { background-color: #303f9f; }

        .bulk-container { max-width: 600px; margin: 0 auto; }
        .bulk-text-area { min-height: 120px; resize: vertical; font-family: monospace; }
    </style>
</head>
<body>

<div id="securityScreen">403 - Access Denied (Unauthorized Device)</div>

<div class="container" id="mainAppContainer">
    <div id="page1" class="page active">
        <div class="main-working-area">
            <div class="form-section">
                <h3 style="margin-bottom: 15px; color: #222;">CBE SMS Data Input</h3>
                
                <div class="form-group">
                    <label for="transactionType">የግብይት አይነት (Type)</label>
                    <select id="transactionType">
                        <option value="Credited">Credited (ብር ሲገባ)</option>
                        <option value="Debited">Debited (ብር ሲወጣ)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fullName">የሰው ስም (Full Name)</label>
                    <input type="text" id="fullName" placeholder="የሰውን ስም እዚህ ይጻፉ...">
                </div>
                <div class="form-group">
                    <label for="accountNumber">ሙሉ የአካውንት ቁጥር (13 ዲጂት)</label>
                    <input type="text" id="accountNumber" placeholder="ቁጥር ብቻ ያስገቡ..." maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                </div>
                <div class="form-group">
                    <label for="amount">የብር መጠን (Amount)</label>
                    <input type="text" id="amount" value="0.00">
                </div>
                
                <button class="btn btn-purple" onclick="generateSMS()">Send / Enter</button>
            </div>

            <div class="preview-section">
                <label style="align-self: flex-start; margin-bottom: 5px;">የተፈጠረው የ CBE መልዕክት፦</label>
                <div id="smsPreview" class="preview-box">
                    መረጃ ሲያስገቡ የ CBE መልዕክት እዚህ ይፈጠራል...
                </div>
                <button class="btn btn-purple" id="copyBtn" onclick="copyToClipboard()">Copy Text</button>
                <button class="btn bulk-link-btn" onclick="goToBulkSender()">Bulk SMS →</button>
            </div>
        </div>
    </div>

    <div id="page2" class="page">
        <div class="bulk-container">
            <h3 style="margin-bottom: 20px; border-bottom: 2px solid var(--success-green); padding-bottom: 5px;">Bulk SMS Gateway</h3>
            
            <div class="form-group">
                <label for="senderDisplayId">የላኪ ስም (Sender ID)</label>
                <input type="text" id="senderDisplayId" value="CBE">
            </div>

            <div class="form-group">
                <label for="receiverPhone">የተቀባይ ስልክ ቁጥር</label>
                <input type="text" id="receiverPhone" placeholder="ምሳሌ፦ 0911223344" oninput="this.value = this.value.replace(/[^0-9+]/g, '');">
            </div>

            <div class="form-group">
                <label for="bulkMessageText">የሚላከው ቴክስት ይዘት</label>
                <textarea id="bulkMessageText" class="bulk-text-area"></textarea>
            </div>

            <button class="btn btn-green" onclick="sendFinalSMS()">Send</button>
            <button class="btn" style="background-color: #777;" onclick="goBackToPage1()">← ተመለስ</button>
        </div>
    </div>
</div>

<script>
    const SECRET_TOKEN = "s2m0s26"; 

    function checkDeviceAuthorization() {
        const authorizedToken = localStorage.getItem("device_security_token");
        if (authorizedToken === SECRET_TOKEN) {
            document.getElementById("securityScreen").style.display = "none";
            document.getElementById("mainAppContainer").style.display = "block";
        } else {
            document.getElementById("securityScreen").style.display = "flex";
            document.getElementById("mainAppContainer").style.display = "none";
        }
    }
    
    window.onload = checkDeviceAuthorization;

    // ኮምፒውተር ላይ ኪቦርድ ላይ 'K' ሲጫን ፓስወርድ ይጠይቃል
    document.addEventListener('keydown', function(e) {
        if (e.key === 'K' || e.key === 'k') {
            promptPassword();
        }
    });

    // ስልክ ላይ ስክሪኑን 3 ጊዜ ሲነኩ ፓስወርድ እንዲጠይቅ
    let clickCount = 0;
    document.getElementById("securityScreen").addEventListener("click", function() {
        clickCount++;
        if (clickCount >= 3) {
            clickCount = 0;
            promptPassword();
        }
    });

    function promptPassword() {
        let password = prompt("የመሣሪያ መፍቀጃ ሚስጥራዊ ኮድ ያስገቡ፦");
        if (password === SECRET_TOKEN) {
            localStorage.setItem("device_security_token", SECRET_TOKEN);
            alert("ይህ መሣሪያ በተሳካ ሁኔታ ተፈቅዶለታል!");
            checkDeviceAuthorization();
        } else {
            alert("የተሳሳተ ኮድ!");
        }
    }

    let isSmsGenerated = false; 
    let generatedGlobalText = ""; 

    function generateSMS() {
        const type = document.getElementById('transactionType').value;
        const fullName = document.getElementById('fullName').value.trim();
        const accountNum = document.getElementById('accountNumber').value.trim();
        const amountInput = document.getElementById('amount').value.trim();

        if (!fullName || !accountNum || !amountInput) {
            alert("እባክዎ መጀመሪያ ሁሉንም መረጃዎች በትክክል ይሙሉ!");
            return;
        }

        if (accountNum.length !== 13) {
            alert("እባክዎ የባንክ አካውንት ቁጥር በትክክል 13 ዲጂት መሆኑን ያረጋግጡ!");
            return;
        }

        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
        const dateStr = now.toLocaleDateString('en-GB');

        let refNo = 'FT';
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        for (let i = 0; i < 10; i++) refNo += chars.charAt(Math.floor(Math.random() * chars.length));

        const formattedAmount = parseFloat(amountInput).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        const startAcc = accountNum.substring(0, 1);
        const endAcc = accountNum.substring(accountNum.length - 4);
        
        generatedGlobalText = `Dear Mr your Account ${startAcc}**********${endAcc} has been ${type} with ETB ${formattedAmount} from ${fullName}, on ${dateStr} at ${timeStr} with Ref No ${refNo} Your Current Balance is ETB ${formattedAmount}. Thank you for Banking with CBE!\nhttps://apps.cbe.com.et:100/?id=${refNo}${accountNum.substring(7)}`;

        const previewBox = document.getElementById('smsPreview');
        previewBox.innerText = generatedGlobalText;
        previewBox.classList.add('generated');
        
        isSmsGenerated = true; 
    }

    function copyToClipboard() {
        if (!isSmsGenerated) {
            alert("እባክዎ መጀመሪያ 'Send / Enter' የሚለውን ቁልፍ ተጭነው ቴክስት ያመንጩ!");
            return;
        }
        navigator.clipboard.writeText(generatedGlobalText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "Copied!";
            setTimeout(() => { copyBtn.innerText = "Copy Text"; }, 2000);
        });
    }

    function goToBulkSender() {
        if (!isSmsGenerated) {
            alert("እባክዎ መጀመሪያ ቴክስት ያመንጩ!");
            return;
        }
        document.getElementById('page1').classList.remove('active');
        document.getElementById('page2').classList.add('active');
        document.getElementById('bulkMessageText').value = generatedGlobalText;
    }

    function goBackToPage1() {
        document.getElementById('page2').classList.remove('active');
        document.getElementById('page1').classList.add('active');
    }

    function sendFinalSMS() {
        const senderId = document.getElementById('senderDisplayId').value.trim();
        const phone = document.getElementById('receiverPhone').value.trim();
        const finalTxt = document.getElementById('bulkMessageText').value.trim();

        if (!senderId || !phone || !finalTxt) { alert("እባክዎ ሁሉንም ሳጥኖች ይሙሉ!"); return; }
        alert(`መልዕክቱ በ Bulk SMS በኩል በተሳካ ሁኔታ ተልኳል!\n\nየላኪ ስም (Sender ID)፦ ${senderId}\nወደ ቁጥር፦ ${phone}`);
    }
</script>
</body>
</html>
